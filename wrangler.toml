name = "davapalooza"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "davapalooza.com/*"
zone_name = "davapalooza.com"

[[routes]]
pattern = "www.davapalooza.com/*"
zone_name = "davapalooza.com"

[[routes]]
pattern = "southoblockparty.com/*"
zone_name = "southoblockparty.com"

[[routes]]
pattern = "www.southoblockparty.com/*"
zone_name = "southoblockparty.com"

# Wakes every 15 minutes; lib/notifyDigest.ts decides whether to act (every run on
# event day, once at 9am Pacific otherwise) and sends ONE summary of new sign-ups and photos.
[triggers]
crons = ["*/15 * * * *"]

[assets]
directory = ".open-next/assets"

[[d1_databases]]
binding = "DB"
database_name = "davapalooza-db"
database_id = "8992dd8c-d737-4f8f-89d1-42a94f4fdbec"

[images]
binding = "IMAGES"

[[r2_buckets]]
binding = "R2"
bucket_name = "southoblockparty-media"
